<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="same-origin">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f5f8">
<title>Forgot password · Easy Budget Planner</title>
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/auth.css">
<script src="../assets/js/auth.js" defer></script>
</head>
<body data-page="forgot">
<div class="auth-wrap">
  <main class="auth-card">
    <a class="auth-brand" href="login.html" aria-label="Easy Budget Planner, sign in">
      <img src="../assets/images/budgetPlanner.avif" alt="" width="128" height="128">
    </a>
    <section data-view="form">
      <h1>Forgot your password?</h1>
      <p class="auth-sub">Enter the email you signed up with and we will send you a link to choose a new password.</p>

      <div class="auth-alert" id="alert" hidden></div>

      <form id="form" novalidate>
      <div class="auth-field">
        <label class="auth-label" for="email"><span>Email</span></label>
        <input class="auth-input" id="email" type="email" name="email" autocomplete="email" inputmode="email" required maxlength="190" placeholder="you@example.com" aria-describedby="email-err" autofocus>
        <em class="field-error" id="email-err" data-for="email" hidden></em>
      </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit">Send reset link</button>
      </form>

      <p class="auth-foot">Remembered it? <a href="login.html">Back to sign in</a></p>
    </section>

    <section data-view="sent" hidden>
      <div class="auth-status">
        <div class="auth-status-icon is-info" id="sent-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg></div>
        <h1 id="sent-title">Check your email</h1>
        <p id="sent-text"></p>
        <p class="auth-small">Sent to <span class="auth-email" id="sent-email"></span>. The link expires in 1 hour and works once. Check your spam folder if it does not arrive.</p>
        <div class="auth-alert" id="sent-alert" hidden></div>
        <div class="auth-actions">
          <a class="btn btn-primary btn-block" href="login.html">Back to sign in</a>
          <button class="btn btn-block" type="button" id="resend">Send again</button>
          <button class="btn btn-ghost btn-block" type="button" id="change-email">Use a different email</button>
        </div>
      </div>
    </section>
  </main>
</div>
</body>
</html>
